spring:
  application:
    name: itinerary-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/tripplanningdb}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://tripplanning-mongo:27017/tripplanningdb}
    redis:
      host: ${SPRING_REDIS_HOST:tripplanning-redis}
      port: ${SPRING_REDIS_PORT:6379}

  neo4j:
    uri: ${SPRING_NEO4J_URI:bolt://tripplanning-neo4j:7687}
    authentication:
      username: ${SPRING_NEO4J_AUTHENTICATION_USERNAME:neo4j}
      password: ${SPRING_NEO4J_AUTHENTICATION_PASSWORD:neo4jpass}

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:tripplanning-secret-key-for-jwt-token-signing}
  expiration: ${JWT_EXPIRATION:86400000}