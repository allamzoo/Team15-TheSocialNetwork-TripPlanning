spring:
  application:
    name: itinerary-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/tripplanningdb}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    mongodb:
      host: ${SPRING_MONGODB_HOST:tripplanning-mongo}
      port: ${SPRING_MONGODB_PORT:27017}
      database: ${SPRING_MONGODB_DATABASE:tripplanningdb}
    redis:
      host: ${SPRING_REDIS_HOST:tripplanning-redis}
      port: ${SPRING_REDIS_PORT:6379}

  neo4j:
    uri: ${SPRING_NEO4J_URI:bolt://tripplanning-neo4j:7687}
    authentication:
      username: ${SPRING_NEO4J_AUTHENTICATION_USERNAME:neo4j}
      password: ${SPRING_NEO4J_AUTHENTICATION_PASSWORD:neo4jpass}

  # M3: RabbitMQ connection
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    virtual-host: /
    listener:
      simple:
        auto-startup: ${M3_MESSAGING_ENABLED:false}
        missing-queues-fatal: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: prometheus,health,info
  endpoint:
    health:
      show-details: always

jwt:
  secret: ${JWT_SECRET:tripplanning-secret-key-for-jwt-token-signing}
  expiration: ${JWT_EXPIRATION:86400000}

# ─── S3 OWNED BLOCK ─────────────────────────────────────────────────────────
# Pull request: feature/m3-s3-feign-amqp-itinerary
# Edit ONLY this block in your S3 PR.
feign:
  user-service:
    url: ${FEIGN_USER_SERVICE_URL:http://localhost:8081}
  destination-service:
    url: ${FEIGN_DESTINATION_SERVICE_URL:http://localhost:8082}
  booking-service:
    url: ${FEIGN_BOOKING_SERVICE_URL:http://localhost:8085}

m3:
  messaging:
    enabled: ${M3_MESSAGING_ENABLED:false}
# ─── END S3 OWNED BLOCK ─────────────────────────────────────────────────────
