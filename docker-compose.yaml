version: '3.8'

services:
  postgres:
    image: postgres:17
    container_name: tripplanning-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tripplanningdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tripplanningdb"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 512m

  mongodb:
    image: mongo:7
    container_name: tripplanning-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m

  redis:
    image: redis:7-alpine
    container_name: tripplanning-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 256m

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.1
    container_name: tripplanning-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - node.store.allow_mmap=false
      - xpack.ml.enabled=false
    ports:
      - "9200:9200"
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512m

  neo4j:
    image: neo4j:5
    container_name: tripplanning-neo4j
    environment:
      NEO4J_AUTH: neo4j/neo4jpass
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 256m
      NEO4J_server_memory_pagecache_size: 128m
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4jdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 512m

  cassandra:
    image: cassandra:4
    container_name: tripplanning-cassandra
    environment:
      CASSANDRA_CLUSTER_NAME: tripplanning-cluster
      MAX_HEAP_SIZE: 256m
      HEAP_NEWSIZE: 64m
    ports:
      - "9042:9042"
    volumes:
      - cassandradata:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' || exit 1"]
      interval: 15s
      timeout: 15s
      retries: 20
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 2g

  # ── M3: RabbitMQ ─────────────────────────────────────────────────────────────
  # Added at Day-0 kickoff so all 5 services can connect from their first M3 PR.
  # Exchanges and queues are NOT declared at startup unless M3_MESSAGING_ENABLED=true
  # (controlled per-service via spring.rabbitmq.listener.simple.auto-startup).
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: tripplanning-rabbitmq
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI (guest/guest)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: user-service
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tripplanningdb
      SPRING_MONGODB_HOST: tripplanning-mongo
      SPRING_MONGODB_PORT: 27017
      SPRING_MONGODB_DATABASE: tripplanningdb
      SPRING_REDIS_HOST: tripplanning-redis
      SPRING_REDIS_PORT: 6379
      # M3 — S1 OWNED: set to "true" only in docker-compose.override.yml (S5-INFRA)
      SPRING_RABBITMQ_HOST: tripplanning-rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      M3_MESSAGING_ENABLED: "false"
      FEIGN_ITINERARY_SERVICE_URL: http://itinerary-service:8080
      FEIGN_BOOKING_SERVICE_URL: http://booking-service:8080
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  destination-service:
    build:
      context: .
      dockerfile: destination-service/Dockerfile
    container_name: destination-service
    ports:
      - "8082:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tripplanningdb
      SPRING_MONGODB_HOST: tripplanning-mongo
      SPRING_MONGODB_PORT: 27017
      SPRING_MONGODB_DATABASE: tripplanningdb
      SPRING_REDIS_HOST: tripplanning-redis
      SPRING_REDIS_PORT: 6379
      SPRING_ELASTICSEARCH_URIS: http://tripplanning-elasticsearch:9200
      # M3 — S2 OWNED
      SPRING_RABBITMQ_HOST: tripplanning-rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      M3_MESSAGING_ENABLED: "false"
      FEIGN_ITINERARY_SERVICE_URL: http://itinerary-service:8080
      FEIGN_USER_SERVICE_URL: http://user-service:8080
      FEIGN_BOOKING_SERVICE_URL: http://booking-service:8080
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  itinerary-service:
    build:
      context: .
      dockerfile: itinerary-service/Dockerfile
    container_name: itinerary-service
    ports:
      - "8083:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tripplanningdb
      SPRING_MONGODB_HOST: tripplanning-mongo
      SPRING_MONGODB_PORT: 27017
      SPRING_MONGODB_DATABASE: tripplanningdb
      SPRING_REDIS_HOST: tripplanning-redis
      SPRING_REDIS_PORT: 6379
      SPRING_NEO4J_URI: bolt://tripplanning-neo4j:7687
      SPRING_NEO4J_AUTHENTICATION_USERNAME: neo4j
      NEO4J_AUTH: neo4j/neo4jpass
      # M3 — S3 OWNED
      SPRING_RABBITMQ_HOST: tripplanning-rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      M3_MESSAGING_ENABLED: "false"
      FEIGN_USER_SERVICE_URL: http://user-service:8080
      FEIGN_DESTINATION_SERVICE_URL: http://destination-service:8080
      FEIGN_BOOKING_SERVICE_URL: http://booking-service:8080
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  activity-service:
    build:
      context: .
      dockerfile: activity-service/Dockerfile
    container_name: activity-service
    ports:
      - "8084:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tripplanningdb
      SPRING_MONGODB_HOST: tripplanning-mongo
      SPRING_MONGODB_PORT: 27017
      SPRING_MONGODB_DATABASE: tripplanningdb
      SPRING_REDIS_HOST: tripplanning-redis
      SPRING_REDIS_PORT: 6379
      CASSANDRA_CONTACT_POINTS: tripplanning-cassandra
      CASSANDRA_KEYSPACE: tripplanning
      CASSANDRA_PORT: 9042
      CASSANDRA_DATACENTER: datacenter1
      # M3 — S4 OWNED
      SPRING_RABBITMQ_HOST: tripplanning-rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      M3_MESSAGING_ENABLED: "false"
      FEIGN_ITINERARY_SERVICE_URL: http://itinerary-service:8080
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_started
      cassandra:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  booking-service:
    build:
      context: .
      dockerfile: booking-service/Dockerfile
    container_name: booking-service
    ports:
      - "8085:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tripplanningdb
      SPRING_MONGODB_HOST: tripplanning-mongo
      SPRING_MONGODB_PORT: 27017
      SPRING_MONGODB_DATABASE: tripplanningdb
      SPRING_DATA_REDIS_HOST: tripplanning-redis
      SPRING_DATA_REDIS_PORT: 6379
      # M3 — S5 OWNED
      SPRING_RABBITMQ_HOST: tripplanning-rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      M3_MESSAGING_ENABLED: "false"
      FEIGN_USER_SERVICE_URL: http://user-service:8080
      FEIGN_ITINERARY_SERVICE_URL: http://itinerary-service:8080
      FEIGN_DESTINATION_SERVICE_URL: http://destination-service:8080
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_started
      rabbitmq:
        condition: service_healthy

volumes:
  pgdata:
  mongodata:
  redisdata:
  esdata:
  neo4jdata:
  cassandradata:
  rabbitmqdata:
