spring:
  application:
    name: destination-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://destination-postgres:5432/tripdb-destinations}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    mongodb:
      host: ${SPRING_MONGODB_HOST:tripplanning-mongo}
      port: ${SPRING_MONGODB_PORT:27017}
      database: ${SPRING_MONGODB_DATABASE:tripplanningdb}
      auto-index-creation: false
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
    elasticsearch:
      repositories:
        enabled: true

  elasticsearch:
    uris: ${SPRING_ELASTICSEARCH_URIS:http://localhost:9200}

  # M3: RabbitMQ connection
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}
    virtual-host: /
    listener:
      simple:
        auto-startup: ${M3_MESSAGING_ENABLED:false}
        missing-queues-fatal: false
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: "prometheus,health,info"
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

jwt:
  secret: ${JWT_SECRET:tripplanning-secret-key-for-jwt-token-signing}
  expiration: ${JWT_EXPIRATION:86400000}

# ─── S2 OWNED BLOCK ─────────────────────────────────────────────────────────
# Pull request: feature/m3-s2-feign-amqp-destination
# Edit ONLY this block in your S2 PR.
feign:
  destination-service:
    url: ${FEIGN_DESTINATION_SERVICE_URL:http://localhost:8080}
  itinerary-service:
    url: ${FEIGN_ITINERARY_SERVICE_URL:http://localhost:8083}
  user-service:
    url: ${FEIGN_USER_SERVICE_URL:http://localhost:8081}
  booking-service:
    url: ${FEIGN_BOOKING_SERVICE_URL:http://localhost:8085}

m3:
  messaging:
    enabled: ${M3_MESSAGING_ENABLED:false}
