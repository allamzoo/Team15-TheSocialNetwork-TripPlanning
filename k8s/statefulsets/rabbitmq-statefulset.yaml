# k8s/statefulsets/rabbitmq-statefulset.yaml
# S5-INFRA — RabbitMQ 3.12 with management plugin
# Exposes AMQP port 5672 (used by all services) and
# management UI port 15672 (for dev inspection: kubectl port-forward).
# Default credentials: guest/guest (matching application.yml defaults).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: tripplanning
spec:
  serviceName: rabbitmq   # matches the headless Service name in rabbitmq-svc.yaml
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.12-management
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: guest
            - name: RABBITMQ_DEFAULT_PASS
              value: guest
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "ping"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "status"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: rabbitmq-pvc
