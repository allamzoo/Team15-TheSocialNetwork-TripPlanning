apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-service
  namespace: tripplanning
  labels:
    app: booking-service
    slice: s5
spec:
  replicas: 1
  selector:
    matchLabels:
      app: booking-service
  template:
    metadata:
      labels:
        app: booking-service
        slice: s5
    spec:
      containers:
        - name: booking-service
          image: <your-registry>/booking-service:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: booking-service-configmap
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: jwt-secret
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30

