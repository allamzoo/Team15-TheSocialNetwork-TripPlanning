# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  redis.yaml — S2-INFRA OWNED (destination-service slice)                     ║
# ║  Defines Redis K8s StatefulSet + Service for the entire platform.            ║
# ║  Replaces docker-compose redis service (image: redis:7-alpine).              ║
# ║  Service name "redis" is resolvable as:                                       ║
# ║    redis.tripplanning.svc.cluster.local:6379                                 ║
# ║  All services connect via SPRING_REDIS_HOST env var.                         ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: tripplanning
  labels:
    app: redis
spec:
  selector:
    app: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
  type: ClusterIP
  clusterIP: None  # Headless service for StatefulSet
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: tripplanning
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
              name: redis
          resources:
            limits:
              memory: 256Mi
            requests:
              memory: 128Mi
          volumeMounts:
            - name: redis-data
              mountPath: /data
          command:
            - redis-server
            - "--appendonly"
            - "yes"
            - "--appendfsync"
            - "everysec"
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: redis-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
