apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tripplanning-mongo
  namespace: tripplanning
spec:
  serviceName: tripplanning-mongo
  replicas: 1
  selector:
    matchLabels:
      app: tripplanning-mongo
  template:
    metadata:
      labels:
        app: tripplanning-mongo
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
          resources:
            limits:
              memory: 512Mi
            requests:
              memory: 256Mi
          readinessProbe:
            exec:
              command: ["mongosh", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 20
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: tripplanning-mongo
  namespace: tripplanning
spec:
  selector:
    app: tripplanning-mongo
  ports:
    - port: 27017
      targetPort: 27017
  type: ClusterIP
