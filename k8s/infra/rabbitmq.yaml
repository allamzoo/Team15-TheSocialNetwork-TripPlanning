# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  rabbitmq.yaml — INFRA OWNED (committed at Day-0 kickoff)                   ║
# ║  Fixes the K8s Service name "rabbitmq" in the tripplanning namespace so      ║
# ║  every microservice can resolve it via DNS:                                  ║
# ║    rabbitmq.tripplanning.svc.cluster.local:5672  (AMQP)                     ║
# ║    rabbitmq.tripplanning.svc.cluster.local:15672 (Management UI)            ║
# ║                                                                              ║
# ║  AMQP env var wired in each service's Deployment (set by each slice's        ║
# ║  k8s/<service>/deployment.yaml):                                             ║
# ║    SPRING_RABBITMQ_HOST: rabbitmq.tripplanning.svc.cluster.local            ║
# ║    SPRING_RABBITMQ_PORT: "5672"                                              ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: tripplanning
  labels:
    app: rabbitmq
spec:
  selector:
    app: rabbitmq
  ports:
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: management
      port: 15672
      targetPort: 15672
  type: ClusterIP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: rabbitmq
  namespace: tripplanning
spec:
  serviceName: rabbitmq
  replicas: 1
  selector:
    matchLabels:
      app: rabbitmq
  template:
    metadata:
      labels:
        app: rabbitmq
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.12-management
          ports:
            - containerPort: 5672
            - containerPort: 15672
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: guest
            - name: RABBITMQ_DEFAULT_PASS
              value: guest
          resources:
            limits:
              memory: 512Mi
            requests:
              memory: 256Mi
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "ping"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 15
            failureThreshold: 20
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "ping"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 15
          volumeMounts:
            - name: rabbitmq-data
              mountPath: /var/lib/rabbitmq
  volumeClaimTemplates:
    - metadata:
        name: rabbitmq-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
