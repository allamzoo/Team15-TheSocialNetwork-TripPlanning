# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  neo4j.yaml — S3-INFRA OWNED                                                ║
# ║  Neo4j graph database used by itinerary-service to store user↔destination  ║
# ║  visit relationships. Mirrors docker-compose Neo4j config (same image,     ║
# ║  same memory limits, same credentials).                                     ║
# ║                                                                              ║
# ║  itinerary-service connects via:                                            ║
# ║    SPRING_NEO4J_URI: bolt://neo4j.tripplanning.svc.cluster.local:7687      ║
# ║    SPRING_NEO4J_AUTHENTICATION_USERNAME: neo4j                              ║
# ║    SPRING_NEO4J_AUTHENTICATION_PASSWORD: neo4jpass                          ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: neo4j-pvc
  namespace: tripplanning
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: neo4j
  namespace: tripplanning
spec:
  serviceName: neo4j
  replicas: 1
  selector:
    matchLabels:
      app: neo4j
  template:
    metadata:
      labels:
        app: neo4j
    spec:
      containers:
        - name: neo4j
          image: neo4j:5
          ports:
            - name: browser
              containerPort: 7474
            - name: bolt
              containerPort: 7687
          env:
            - name: NEO4J_AUTH
              value: neo4j/neo4jpass
            - name: NEO4J_server_memory_heap_initial__size
              value: 256m
            - name: NEO4J_server_memory_heap_max__size
              value: 256m
            - name: NEO4J_server_memory_pagecache_size
              value: 128m
            - name: NEO4J_server_config_strict__validation_enabled
              value: "false"
          resources:
            limits:
              memory: 512Mi
            requests:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 7474
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /
              port: 7474
            initialDelaySeconds: 90
            periodSeconds: 30
          volumeMounts:
            - name: neo4j-data
              mountPath: /data
      volumes:
        - name: neo4j-data
          persistentVolumeClaim:
            claimName: neo4j-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: neo4j
  namespace: tripplanning
  labels:
    app: neo4j
spec:
  selector:
    app: neo4j
  ports:
    - name: browser
      port: 7474
      targetPort: 7474
    - name: bolt
      port: 7687
      targetPort: 7687
  type: ClusterIP
