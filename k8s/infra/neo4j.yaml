apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tripplanning-neo4j
  namespace: tripplanning
spec:
  serviceName: tripplanning-neo4j
  replicas: 1
  selector:
    matchLabels:
      app: tripplanning-neo4j
  template:
    metadata:
      labels:
        app: tripplanning-neo4j
    spec:
      containers:
        - name: neo4j
          image: neo4j:5
          ports:
            - containerPort: 7474
            - containerPort: 7687
          env:
            - name: NEO4J_AUTH
              value: "neo4j/neo4jpass"
            - name: NEO4J_PLUGINS
              value: '["apoc"]'
          resources:
            limits:
              memory: 1Gi
            requests:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 7474
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 20
          volumeMounts:
            - name: neo4j-data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: neo4j-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: tripplanning-neo4j
  namespace: tripplanning
spec:
  selector:
    app: tripplanning-neo4j
  ports:
    - name: http
      port: 7474
      targetPort: 7474
    - name: bolt
      port: 7687
      targetPort: 7687
  type: ClusterIP
