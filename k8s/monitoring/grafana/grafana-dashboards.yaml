# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║       grafana-dashboards.yaml — SHARED FILE                                 ║
# ║  STABLE STRUCTURE agreed at M3 Day-0 kickoff.                               ║
# ║  The provisioner ConfigMap (dashboards.yaml key) is MONITORING-INFRA owned  ║
# ║  — do not edit it in feature PRs.                                           ║
# ║  Each slice's INFRA sub-task replaces ONLY its own dashboard JSON key        ║
# ║  in the grafana-dashboard-files ConfigMap (marked S<n> OWNED BLOCK below).  ║
# ║  Minimum panel requirements per dashboard:                                  ║
# ║    ≥ 3 PromQL panels (from prometheus scrape job) +                         ║
# ║    ≥ 3 LogQL panels  (from Loki datasource)                                 ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-config
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  # ── MONITORING-INFRA OWNED — do not edit in feature slice PRs ────────────────
  # This ConfigMap tells Grafana where to load dashboard JSON files from.
  # Dashboard JSON files are embedded in the grafana-dashboard-files ConfigMap
  # and mounted at /etc/grafana/provisioning/dashboards/tripplanning/.
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: Trip Planning
        orgId: 1
        folder: Trip Planning
        folderUid: tripplanning
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /etc/grafana/provisioning/dashboards/tripplanning
          foldersFromFilesStructure: false

---
# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  grafana-dashboard-files — each S<n>-INFRA slice replaces its own JSON key  ║
# ║  Do NOT modify another slice's JSON key in your PR.                         ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-files
  namespace: monitoring
data:
  # ┌─ S1 OWNED BLOCK ─ PR: feature/m3-s1-infra-user ─────────────────────────┐
  # │ Replace the placeholder JSON with a real Grafana dashboard JSON.         │
  # │ Required panels: HTTP req/s, error rate, p99 latency (PromQL) +         │
  # │   log volume, error logs, slow-query logs (LogQL).                      │
  # └──────────────────────────────────────────────────────────────────────────┘
  user-dashboard.json: |
    { "title": "User Service Dashboard", "panels": [], "schemaVersion": 36, "version": 1 }

  # ┌─ S2 OWNED BLOCK ─ PR: feature/m3-s2-infra-destination ──────────────────┐
  destination-dashboard.json: |
    { "title": "Destination Service Dashboard", "panels": [], "schemaVersion": 36, "version": 1 }

  # ┌─ S3 OWNED BLOCK ─ PR: feat/M3/itinerary/S3-READ-DB/55-4895 ────────────┐
  # │ 3 PromQL panels + 3 LogQL panels                                        │
  # │ Saga panels: status transition log counts                                │
  # └──────────────────────────────────────────────────────────────────────────┘
  itinerary-dashboard.json: |
    {
      "title": "Itinerary Service Dashboard",
      "uid": "itinerary-service",
      "schemaVersion": 36,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "HTTP Request Rate",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 0 },
          "targets": [{
            "expr": "sum(rate(http_server_requests_seconds_count{application=\"itinerary-service\"}[1m])) by (uri, method)",
            "legendFormat": "{{method}} {{uri}}"
          }]
        },
        {
          "id": 2,
          "title": "HTTP Error Rate (5xx)",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 0 },
          "targets": [{
            "expr": "sum(rate(http_server_requests_seconds_count{application=\"itinerary-service\",status=~\"5..\"}[1m]))",
            "legendFormat": "5xx errors/s"
          }]
        },
        {
          "id": 3,
          "title": "P99 Request Latency",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 0 },
          "targets": [{
            "expr": "histogram_quantile(0.99, sum(rate(http_server_requests_seconds_bucket{application=\"itinerary-service\"}[1m])) by (le, uri))",
            "legendFormat": "p99 {{uri}}"
          }]
        },
        {
          "id": 4,
          "title": "Log Volume by Level",
          "type": "timeseries",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 8, "w": 8, "x": 0, "y": 8 },
          "targets": [{
            "expr": "sum(rate({app=\"itinerary-service\"}[1m])) by (level)",
            "legendFormat": "{{level}}"
          }]
        },
        {
          "id": 5,
          "title": "Error Logs",
          "type": "logs",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 8, "w": 8, "x": 8, "y": 8 },
          "targets": [{
            "expr": "{app=\"itinerary-service\"} |= \"ERROR\"",
            "legendFormat": ""
          }]
        },
        {
          "id": 6,
          "title": "Saga State Transitions",
          "type": "logs",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 8, "w": 8, "x": 16, "y": 8 },
          "targets": [{
            "expr": "{app=\"itinerary-service\"} |~ \"COMPLETING|PAYMENT_PENDING|PAID|PAYMENT_FAILED|REFUNDED\"",
            "legendFormat": ""
          }]
        }
      ]
    }

  # ┌─ S4 OWNED BLOCK ─ PR: feature/m3-s4-infra-activity ─────────────────────┐
  # │ Include Cassandra write latency panel (PromQL).                          │
  # └──────────────────────────────────────────────────────────────────────────┘
  activity-dashboard.json: |
    { "title": "Activity Service Dashboard", "panels": [], "schemaVersion": 36, "version": 1 }

  # ┌─ S5 OWNED BLOCK ─ PR: feature/m3-s5-infra-booking ──────────────────────┐
  # │ LogQL panels : error rate, RabbitMQ event audit, saga state transitions  │
  # │ PromQL panels: HTTP request rate, HikariCP pool, RabbitMQ throughput     │
  # └──────────────────────────────────────────────────────────────────────────┘
  booking-dashboard.json: |
    {
      "title": "Booking Service Dashboard",
      "uid": "booking-service",
      "schemaVersion": 36,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "templating": { "list": [] },
      "annotations": { "list": [] },
      "panels": [
        {
          "id": 1,
          "title": "Error Rate (errors/min)",
          "description": "Count of ERROR-level log lines from booking-service per minute. Spike = saga failure or bad payment event.",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "loki", "uid": "loki" },
          "targets": [
            {
              "expr": "sum(count_over_time({app=\"tripplanning\", service=\"booking-service\", level=\"ERROR\"} [1m]))",
              "legendFormat": "errors/min",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "fixed", "fixedColor": "red" },
              "custom": { "lineWidth": 2 }
            }
          }
        },
        {
          "id": 2,
          "title": "RabbitMQ Event Audit",
          "description": "Log lines emitted by event publishers and consumers filtered by routing key. Shows itinerary.completed consumed vs payment.initiated published in the last hour.",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "loki", "uid": "loki" },
          "targets": [
            {
              "expr": "sum(count_over_time({app=\"tripplanning\", service=\"booking-service\"} |= \"itinerary.completed\" [1m]))",
              "legendFormat": "itinerary.completed consumed",
              "refId": "A"
            },
            {
              "expr": "sum(count_over_time({app=\"tripplanning\", service=\"booking-service\"} |= \"payment.initiated\" [1m]))",
              "legendFormat": "payment.initiated published",
              "refId": "B"
            }
          ]
        },
        {
          "id": 3,
          "title": "Saga State Transitions",
          "description": "Log lines at each saga step filtered by saga keywords. Visualizes SETTLEMENT_PENDING → SETTLED / PAYMENT_FAILED flow over time.",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "datasource": { "type": "loki", "uid": "loki" },
          "targets": [
            {
              "expr": "sum(count_over_time({app=\"tripplanning\", service=\"booking-service\"} |= \"SETTLEMENT_PENDING\" [1m]))",
              "legendFormat": "SETTLEMENT_PENDING",
              "refId": "A"
            },
            {
              "expr": "sum(count_over_time({app=\"tripplanning\", service=\"booking-service\"} |= \"SETTLED\" [1m]))",
              "legendFormat": "SETTLED",
              "refId": "B"
            },
            {
              "expr": "sum(count_over_time({app=\"tripplanning\", service=\"booking-service\"} |= \"PAYMENT_FAILED\" [1m]))",
              "legendFormat": "PAYMENT_FAILED",
              "refId": "C"
            },
            {
              "expr": "sum(count_over_time({app=\"tripplanning\", service=\"booking-service\"} |= \"REFUNDED\" [1m]))",
              "legendFormat": "REFUNDED",
              "refId": "D"
            }
          ]
        },
        {
          "id": 4,
          "title": "HTTP Request Rate (req/s)",
          "description": "Requests per second per booking endpoint. Shows which endpoints are under most load during peak booking hours.",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum by (uri) (rate(http_server_requests_seconds_count{job=\"booking-service\"}[5m]))",
              "legendFormat": "{{uri}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "title": "HikariCP Connection Pool",
          "description": "Active DB connections vs pool size. Pool exhaustion alert — booking-service during saga fan-out may use all connections simultaneously.",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "hikaricp_connections_active{job=\"booking-service\"}",
              "legendFormat": "active connections",
              "refId": "A"
            },
            {
              "expr": "hikaricp_connections_max{job=\"booking-service\"}",
              "legendFormat": "pool max size",
              "refId": "B"
            },
            {
              "expr": "hikaricp_connections_pending{job=\"booking-service\"}",
              "legendFormat": "threads waiting",
              "refId": "C"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": { "lineWidth": 2 }
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "pool max size" },
                "properties": [
                  { "id": "color", "value": { "mode": "fixed", "fixedColor": "orange" } }
                ]
              }
            ]
          }
        },
        {
          "id": 6,
          "title": "RabbitMQ Consumer Throughput",
          "description": "Messages published vs consumed on payment queues. Consumer lag = published count > consumed count by > 100 — indicates saga backlog.",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "sum(rate(rabbitmq_channel_messages_published_total{job=\"booking-service\"}[5m]))",
              "legendFormat": "published/s",
              "refId": "A"
            },
            {
              "expr": "sum(rate(rabbitmq_channel_messages_consumed_total{job=\"booking-service\"}[5m]))",
              "legendFormat": "consumed/s",
              "refId": "B"
            }
          ]
        }
      ]
    }
