# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║       grafana-dashboards.yaml — SHARED FILE                                 ║
# ║  STABLE STRUCTURE agreed at M3 Day-0 kickoff.                               ║
# ║  The provisioner ConfigMap (dashboards.yaml key) is MONITORING-INFRA owned  ║
# ║  — do not edit it in feature PRs.                                           ║
# ║  Each slice's INFRA sub-task replaces ONLY its own dashboard JSON key        ║
# ║  in the grafana-dashboard-files ConfigMap (marked S<n> OWNED BLOCK below).  ║
# ║  Minimum panel requirements per dashboard:                                  ║
# ║    ≥ 3 PromQL panels (from prometheus scrape job) +                         ║
# ║    ≥ 3 LogQL panels  (from Loki datasource)                                 ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-config
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  # ── MONITORING-INFRA OWNED — do not edit in feature slice PRs ────────────────
  # This ConfigMap tells Grafana where to load dashboard JSON files from.
  # Dashboard JSON files are embedded in the grafana-dashboard-files ConfigMap
  # and mounted at /etc/grafana/provisioning/dashboards/tripplanning/.
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: Trip Planning
        orgId: 1
        folder: Trip Planning
        folderUid: tripplanning
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /etc/grafana/provisioning/dashboards/tripplanning
          foldersFromFilesStructure: false

---
# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  grafana-dashboard-files — each S<n>-INFRA slice replaces its own JSON key  ║
# ║  Do NOT modify another slice's JSON key in your PR.                         ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-files
  namespace: monitoring
data:
  # ┌─ S1 OWNED BLOCK ─ PR: feature/m3-s1-infra-user ─────────────────────────┐
  # │ Replace the placeholder JSON with a real Grafana dashboard JSON.         │
  # │ Required panels: HTTP req/s, error rate, p99 latency (PromQL) +         │
  # │   log volume, error logs, slow-query logs (LogQL).                      │
  # └──────────────────────────────────────────────────────────────────────────┘
  user-dashboard.json: |
    { "title": "User Service Dashboard", "panels": [], "schemaVersion": 36, "version": 1 }

  # ┌─ S2 OWNED BLOCK ─ PR: feature/m3-s2-infra-destination ──────────────────┐
  destination-dashboard.json: |
    {
      "title": "Destination Service Dashboard",
      "uid": "destination-service",
      "schemaVersion": 36,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Error Rate — destination-service (errors/min)",
          "description": "Count of ERROR-level log lines per minute. Spike detection: if destination-service logs many ERRORs in one minute something is wrong.",
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
          "datasource": { "type": "loki", "uid": "loki" },
          "targets": [
            {
              "expr": "sum(count_over_time({app=\"tripplanning\", service=\"destination-service\", level=\"ERROR\"}[1m]))",
              "legendFormat": "errors/min",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Feign Call Outcomes — destination-service",
          "description": "Successful Feign responses vs FeignException catches. Detects when itinerary-service or user-service is degraded.",
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
          "datasource": { "type": "loki", "uid": "loki" },
          "targets": [
            {
              "expr": "sum(count_over_time({app=\"tripplanning\", service=\"destination-service\"} |= \"returned successfully\" [5m]))",
              "legendFormat": "feign success",
              "refId": "A"
            },
            {
              "expr": "sum(count_over_time({app=\"tripplanning\", service=\"destination-service\"} |= \"Feign call to\" |= \"failed\" [5m]))",
              "legendFormat": "feign failures",
              "refId": "B"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "RabbitMQ Event Audit — destination-service",
          "description": "Published destination.status-changed and destination.rated events vs consumed itinerary events. Verifies the full event flow.",
          "gridPos": { "x": 0, "y": 8, "w": 12, "h": 8 },
          "datasource": { "type": "loki", "uid": "loki" },
          "targets": [
            {
              "expr": "sum(count_over_time({app=\"tripplanning\", service=\"destination-service\"} |= \"Published destination.status-changed\" [5m]))",
              "legendFormat": "published status-changed",
              "refId": "A"
            },
            {
              "expr": "sum(count_over_time({app=\"tripplanning\", service=\"destination-service\"} |= \"Published destination.rated\" [5m]))",
              "legendFormat": "published rated",
              "refId": "B"
            },
            {
              "expr": "sum(count_over_time({app=\"tripplanning\", service=\"destination-service\"} |= \"Consuming itinerary\" [5m]))",
              "legendFormat": "itinerary events consumed",
              "refId": "C"
            }
          ]
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Slow Operations — destination-service",
          "description": "Log lines where an operation exceeded 1000 ms threshold. Alert when dashboard aggregation or revenue Feign chain is slow.",
          "gridPos": { "x": 12, "y": 8, "w": 12, "h": 8 },
          "datasource": { "type": "loki", "uid": "loki" },
          "targets": [
            {
              "expr": "sum(count_over_time({app=\"tripplanning\", service=\"destination-service\"} |= \"Slow\" [5m]))",
              "legendFormat": "slow ops",
              "refId": "A"
            }
          ]
        }
      ]
    }

  # ┌─ S3 OWNED BLOCK ─ PR: feature/m3-s3-infra-itinerary ────────────────────┐
  # │ Include saga state-machine panels: COMPLETING/PAYMENT_PENDING/PAID/      │
  # │ PAYMENT_FAILED counts (PromQL counter metrics from ItinerarySaga).       │
  # └──────────────────────────────────────────────────────────────────────────┘
  itinerary-dashboard.json: |
    { "title": "Itinerary Service Dashboard", "panels": [], "schemaVersion": 36, "version": 1 }

  # ┌─ S4 OWNED BLOCK ─ PR: feature/m3-s4-infra-activity ─────────────────────┐
  # │ Include Cassandra write latency panel (PromQL).                          │
  # └──────────────────────────────────────────────────────────────────────────┘
  activity-dashboard.json: |
    { "title": "Activity Service Dashboard", "panels": [], "schemaVersion": 36, "version": 1 }

  # ┌─ S5 OWNED BLOCK ─ PR: feature/m3-s5-infra-booking ──────────────────────┐
  # │ Include settlement saga panels: SETTLEMENT_PENDING/SETTLED/REFUNDED     │
  # │ counts + payment failure rate (PromQL counter metrics from SettlementSaga).│
  # └──────────────────────────────────────────────────────────────────────────┘
  booking-dashboard.json: |
    { "title": "Booking Service Dashboard", "panels": [], "schemaVersion": 36, "version": 1 }
