# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║       grafana-dashboards.yaml — SHARED FILE                                 ║
# ║  STABLE STRUCTURE agreed at M3 Day-0 kickoff.                               ║
# ║  The provisioner ConfigMap (dashboards.yaml key) is MONITORING-INFRA owned  ║
# ║  — do not edit it in feature PRs.                                           ║
# ║  Each slice's INFRA sub-task replaces ONLY its own dashboard JSON key        ║
# ║  in the grafana-dashboard-files ConfigMap (marked S<n> OWNED BLOCK below).  ║
# ║  Minimum panel requirements per dashboard:                                  ║
# ║    ≥ 3 PromQL panels (from prometheus scrape job) +                         ║
# ║    ≥ 3 LogQL panels  (from Loki datasource)                                 ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-config
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  # ── MONITORING-INFRA OWNED — do not edit in feature slice PRs ────────────────
  # This ConfigMap tells Grafana where to load dashboard JSON files from.
  # Dashboard JSON files are embedded in the grafana-dashboard-files ConfigMap
  # and mounted at /etc/grafana/provisioning/dashboards/tripplanning/.
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: Trip Planning
        orgId: 1
        folder: Trip Planning
        folderUid: tripplanning
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /etc/grafana/provisioning/dashboards/tripplanning
          foldersFromFilesStructure: false

---
# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  grafana-dashboard-files — each S<n>-INFRA slice replaces its own JSON key  ║
# ║  Do NOT modify another slice's JSON key in your PR.                         ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-files
  namespace: monitoring
data:
  # ┌─ S1 OWNED BLOCK ─ PR: feature/m3-s1-infra-user ─────────────────────────┐
  # │ Replace the placeholder JSON with a real Grafana dashboard JSON.         │
  # │ Required panels: HTTP req/s, error rate, p99 latency (PromQL) +         │
  # │   log volume, error logs, slow-query logs (LogQL).                      │
  # └──────────────────────────────────────────────────────────────────────────┘
  user-dashboard.json: |
    { "title": "User Service Dashboard", "panels": [], "schemaVersion": 36, "version": 1 }

  # ┌─ S2 OWNED BLOCK ─ PR: feature/m3-s2-infra-destination ──────────────────┐
  destination-dashboard.json: |
    { "title": "Destination Service Dashboard", "panels": [], "schemaVersion": 36, "version": 1 }

  # ┌─ S3 OWNED BLOCK ─ PR: feature/m3-s3-infra-itinerary ────────────────────┐
  # │ Panels: HTTP req/s, P50/P95/P99 latency, JVM heap (PromQL)             │
  # │       + error rate, saga state transitions, Feign outcomes (LogQL)     │
  # └──────────────────────────────────────────────────────────────────────────┘
  itinerary-dashboard.json: |
    {
      "title": "Itinerary Service Dashboard",
      "uid": "itinerary-service",
      "schemaVersion": 36,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "HTTP Request Rate (req/s)",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum by (uri, method) (rate(http_server_requests_seconds_count{job=\"itinerary-service\"}[5m]))",
              "legendFormat": "{{method}} {{uri}}"
            }
          ]
        },
        {
          "id": 2,
          "title": "HTTP Latency Percentiles (P50 / P95 / P99)",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "histogram_quantile(0.50, sum by (le, uri) (rate(http_server_requests_seconds_bucket{job=\"itinerary-service\"}[5m])))",
              "legendFormat": "P50 {{uri}}"
            },
            {
              "refId": "B",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "histogram_quantile(0.95, sum by (le, uri) (rate(http_server_requests_seconds_bucket{job=\"itinerary-service\"}[5m])))",
              "legendFormat": "P95 {{uri}}"
            },
            {
              "refId": "C",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "histogram_quantile(0.99, sum by (le, uri) (rate(http_server_requests_seconds_bucket{job=\"itinerary-service\"}[5m])))",
              "legendFormat": "P99 {{uri}}"
            }
          ]
        },
        {
          "id": 3,
          "title": "JVM Heap Usage",
          "type": "timeseries",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 8 },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "jvm_memory_used_bytes{job=\"itinerary-service\", area=\"heap\"}",
              "legendFormat": "Heap Used"
            },
            {
              "refId": "B",
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "jvm_memory_max_bytes{job=\"itinerary-service\", area=\"heap\"}",
              "legendFormat": "Heap Max"
            }
          ]
        },
        {
          "id": 4,
          "title": "Error Rate (ERROR logs/min)",
          "type": "timeseries",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "sum(count_over_time({app=\"tripplanning\", service=\"itinerary-service\", level=\"ERROR\"}[1m]))",
              "legendFormat": "Errors/min"
            }
          ]
        },
        {
          "id": 5,
          "title": "Saga State Transitions",
          "type": "timeseries",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "count_over_time({app=\"tripplanning\", service=\"itinerary-service\"} |= \"COMPLETING\" [1m])",
              "legendFormat": "COMPLETING"
            },
            {
              "refId": "B",
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "count_over_time({app=\"tripplanning\", service=\"itinerary-service\"} |= \"PAYMENT_PENDING\" [1m])",
              "legendFormat": "PAYMENT_PENDING"
            },
            {
              "refId": "C",
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "count_over_time({app=\"tripplanning\", service=\"itinerary-service\"} |= \"PAID\" [1m])",
              "legendFormat": "PAID"
            },
            {
              "refId": "D",
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "count_over_time({app=\"tripplanning\", service=\"itinerary-service\"} |= \"PAYMENT_FAILED\" [1m])",
              "legendFormat": "PAYMENT_FAILED"
            }
          ]
        },
        {
          "id": 6,
          "title": "Feign Call Outcomes (Errors vs Success)",
          "type": "timeseries",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 24 },
          "targets": [
            {
              "refId": "A",
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "count_over_time({app=\"tripplanning\", service=\"itinerary-service\"} |= \"FeignException\" [1m])",
              "legendFormat": "Feign Errors"
            },
            {
              "refId": "B",
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "count_over_time({app=\"tripplanning\", service=\"itinerary-service\"} |= \"Feign\" != \"FeignException\" [1m])",
              "legendFormat": "Feign Success"
            }
          ]
        }
      ]
    }

  # ┌─ S4 OWNED BLOCK ─ PR: feature/m3-s4-infra-activity ─────────────────────┐
  # │ Include Cassandra write latency panel (PromQL).                          │
  # └──────────────────────────────────────────────────────────────────────────┘
  activity-dashboard.json: |
    { "title": "Activity Service Dashboard", "panels": [], "schemaVersion": 36, "version": 1 }

  # ┌─ S5 OWNED BLOCK ─ PR: feature/m3-s5-infra-booking ──────────────────────┐
  # │ Include settlement saga panels: SETTLEMENT_PENDING/SETTLED/REFUNDED     │
  # │ counts + payment failure rate (PromQL counter metrics from SettlementSaga).│
  # └──────────────────────────────────────────────────────────────────────────┘
  booking-dashboard.json: |
    { "title": "Booking Service Dashboard", "panels": [], "schemaVersion": 36, "version": 1 }
