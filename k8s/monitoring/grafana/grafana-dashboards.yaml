# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║       grafana-dashboards.yaml — SHARED FILE                                 ║
# ║  STABLE STRUCTURE agreed at M3 Day-0 kickoff.                               ║
# ║  The provisioner ConfigMap (dashboards.yaml key) is MONITORING-INFRA owned  ║
# ║  — do not edit it in feature PRs.                                           ║
# ║  Each slice's INFRA sub-task replaces ONLY its own dashboard JSON key        ║
# ║  in the grafana-dashboard-files ConfigMap (marked S<n> OWNED BLOCK below).  ║
# ║  Minimum panel requirements per dashboard:                                  ║
# ║    ≥ 3 PromQL panels (from prometheus scrape job) +                         ║
# ║    ≥ 3 LogQL panels  (from Loki datasource)                                 ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-config
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  # ── MONITORING-INFRA OWNED — do not edit in feature slice PRs ────────────────
  # This ConfigMap tells Grafana where to load dashboard JSON files from.
  # Dashboard JSON files are embedded in the grafana-dashboard-files ConfigMap
  # and mounted at /etc/grafana/provisioning/dashboards/tripplanning/.
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: Trip Planning
        orgId: 1
        folder: Trip Planning
        folderUid: tripplanning
        type: file
        disableDeletion: false
        updateIntervalSeconds: 30
        allowUiUpdates: true
        options:
          path: /etc/grafana/provisioning/dashboards/tripplanning
          foldersFromFilesStructure: false

---
# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  grafana-dashboard-files — each S<n>-INFRA slice replaces its own JSON key  ║
# ║  Do NOT modify another slice's JSON key in your PR.                         ║
# ╚══════════════════════════════════════════════════════════════════════════════╝
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-files
  namespace: monitoring
data:
  # ┌─ S1 OWNED BLOCK ─ PR: feature/m3-s1-infra-user ─────────────────────────┐
  # │ Replace the placeholder JSON with a real Grafana dashboard JSON.         │
  # │ Required panels: HTTP req/s, error rate, p99 latency (PromQL) +         │
  # │   log volume, error logs, slow-query logs (LogQL).                      │
  # └──────────────────────────────────────────────────────────────────────────┘
  user-dashboard.json: |
    { "title": "User Service Dashboard", "panels": [], "schemaVersion": 36, "version": 1 }

  # ┌─ S2 OWNED BLOCK ─ PR: feature/m3-s2-infra-destination ──────────────────┐
  destination-dashboard.json: |
    { "title": "Destination Service Dashboard", "panels": [], "schemaVersion": 36, "version": 1 }

  # ┌─ S3 OWNED BLOCK ─ PR: feature/m3-s3-infra-itinerary ────────────────────┐
  # │ Include saga state-machine panels: COMPLETING/PAYMENT_PENDING/PAID/      │
  # │ PAYMENT_FAILED counts (PromQL counter metrics from ItinerarySaga).       │
  # └──────────────────────────────────────────────────────────────────────────┘
  itinerary-dashboard.json: |
    { "title": "Itinerary Service Dashboard", "panels": [], "schemaVersion": 36, "version": 1 }

  # ┌─ S4 OWNED BLOCK ─ PR: feature/m3-s4-infra-activity ─────────────────────┐
  # │ Include Cassandra write latency panel (PromQL).                          │
  # └──────────────────────────────────────────────────────────────────────────┘
  activity-dashboard.json: |
    activity-dashboard.json: |
    {
      "title": "Activity Service Dashboard",
      "uid": "activity-service-dashboard",
      "schemaVersion": 36,
      "version": 1,
      "refresh": "30s",
      "panels": [
        {
          "id": 1,
          "title": "HTTP Request Rate (req/s)",
          "type": "timeseries",
          "description": "PromQL Panel 1 - Requests per second on activity-service endpoints",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "rate(http_server_requests_seconds_count{job=\"activity-service\"}[5m])",
              "legendFormat": "{{uri}} {{method}}"
            }
          ],
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 }
        },
        {
          "id": 2,
          "title": "JVM Heap Usage (bytes)",
          "type": "timeseries",
          "description": "PromQL Panel 2 - Heap memory used vs max",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "jvm_memory_used_bytes{job=\"activity-service\", area=\"heap\"}",
              "legendFormat": "heap used"
            },
            {
              "expr": "jvm_memory_max_bytes{job=\"activity-service\", area=\"heap\"}",
              "legendFormat": "heap max"
            }
          ],
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 }
        },
        {
          "id": 3,
          "title": "RabbitMQ Consumer Throughput",
          "type": "timeseries",
          "description": "PromQL Panel 3 - Messages consumed per minute on activity.itinerary.saga-listener",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "expr": "increase(spring_rabbitmq_listener_seconds_count{job=\"activity-service\"}[1m])",
              "legendFormat": "messages consumed/min"
            }
          ],
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 }
        },
        {
          "id": 4,
          "title": "Error Rate (errors/min)",
          "type": "timeseries",
          "description": "LogQL Panel 1 - ERROR-level log lines per minute",
          "datasource": { "type": "loki", "uid": "loki" },
          "targets": [
            {
              "expr": "sum(count_over_time({service=\"activity-service\", level=\"ERROR\"}[1m]))",
              "legendFormat": "errors/min"
            }
          ],
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 }
        },
        {
          "id": 5,
          "title": "RabbitMQ Event Audit (activity.events)",
          "type": "timeseries",
          "description": "LogQL Panel 2 - activity.* routing key publish and consume log lines",
          "datasource": { "type": "loki", "uid": "loki" },
          "targets": [
            {
              "expr": "count_over_time({service=\"activity-service\"} | json | routingKey=~\"activity\\\\..*\"[5m])",
              "legendFormat": "activity events/5m"
            }
          ],
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 }
        },
        {
          "id": 6,
          "title": "Cassandra Lifecycle Writes (COMPLETED / CANCELLED)",
          "type": "logs",
          "description": "LogQL Panel 3 - Log lines for fresh Cassandra status row inserts",
          "datasource": { "type": "loki", "uid": "loki" },
          "targets": [
            {
              "expr": "{service=\"activity-service\"} | json | message=~\".*saved with status=(COMPLETED|CANCELLED).*\"",
              "legendFormat": ""
            }
          ],
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 24 }
        }
      ]
    }

  # ┌─ S5 OWNED BLOCK ─ PR: feature/m3-s5-infra-booking ──────────────────────┐
  # │ Include settlement saga panels: SETTLEMENT_PENDING/SETTLED/REFUNDED     │
  # │ counts + payment failure rate (PromQL counter metrics from SettlementSaga).│
  # └──────────────────────────────────────────────────────────────────────────┘
  booking-dashboard.json: |
    { "title": "Booking Service Dashboard", "panels": [], "schemaVersion": 36, "version": 1 }
