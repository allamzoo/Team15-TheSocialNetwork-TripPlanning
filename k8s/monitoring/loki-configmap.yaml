# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║  loki-configmap.yaml — S2-INFRA OWNED (destination-service slice)            ║
# ║  Provides Loki configuration for log aggregation and scraping.               ║
# ║  StatefulSet in loki.yaml mounts this as /etc/loki/config.yaml              ║
# ║  All services push logs via Loki4J (HTTP endpoint on port 3100/loki/api/v1) ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: monitoring
  labels:
    app: loki
data:
  config.yaml: |
    auth_enabled: false

    ingester:
      chunk_idle_period: 3m
      chunk_retain_period: 1m
      max_chunk_age: 1h
      chunk_encoding: snappy
      lifecycler:
        ring:
          kvstore:
            store: inmemory
          replication_factor: 1

    limits_config:
      enforce_metric_name: false
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      ingestion_rate_mb: 256
      ingestion_burst_size_mb: 512

    schema_config:
      configs:
        - from: 2020-10-24
          store: boltdb-shipper
          object_store: filesystem
          schema: v11
          index:
            prefix: index_
            period: 24h

    server:
      http_listen_port: 3100
      log_level: info

    storage_config:
      boltdb_shipper:
        active_index_directory: /loki/boltdb-shipper-active
        shared_store: filesystem
        cache_location: /loki/boltdb-shipper-cache
      filesystem:
        directory: /loki/chunks

    chunk_store_config:
      max_look_back_period: 0s

    table_manager:
      retention_deletes_enabled: false
      retention_period: 0s
