apiVersion: apps/v1
kind: Deployment
metadata:
  name: destination-service
  namespace: tripplanning
spec:
  replicas: 1
  selector:
    matchLabels:
      app: destination-service
  template:
    metadata:
      labels:
        app: destination-service
    spec:
      containers:
        - name: destination-service
          image: <your-registry>/destination-service:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: destination-service-configmap
            - secretRef:
                name: destination-postgres-secret
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: jwt-secret
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30