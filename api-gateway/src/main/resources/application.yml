spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: user-service
              uri: http://user-service:8080
              predicates:
                - Path=/api/users/**, /api/auth/**, /api/saved-destinations/**

            - id: destination-service
              uri: http://destination-service:8080
              predicates:
                - Path=/api/destinations/**

            - id: itinerary-service
              uri: http://itinerary-service:8080
              predicates:
                - Path=/api/itineraries/**, /api/itinerary-days/**

            - id: activity-service
              uri: http://activity-service:8080
              predicates:
                - Path=/api/activities/**

            - id: booking-service
              uri: http://booking-service:8080
              predicates:
                - Path=/api/bookings/**, /api/coupons/**, /api/booking-coupons/**

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:dGhpcyBpcyBhIHZlcnkgbG9uZyBzZWNyZXQga2V5IGZvciBqd3Q=}

gateway:
  public-paths:
    - /api/auth/register
    - /api/auth/login
    - /api/users/health
    - /api/destinations/health
    - /api/itineraries/health
    - /api/activities/health
    - /api/bookings/health

management:
  endpoints:
    web:
      exposure:
        include: "health,info"