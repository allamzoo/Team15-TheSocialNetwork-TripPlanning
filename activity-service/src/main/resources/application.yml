spring:
  application:
    name: activity-service

  autoconfigure:
    exclude:
      - org.springframework.boot.cassandra.autoconfigure.CassandraAutoConfiguration
      - org.springframework.boot.data.cassandra.autoconfigure.DataCassandraAutoConfiguration
      - org.springframework.boot.data.cassandra.autoconfigure.DataCassandraReactiveAutoConfiguration

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://activity-postgres:5432/tripdb-activities}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://root:rootpass@mongo:27017/tripplanningmongo?authSource=admin}
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}
      password: ${SPRING_REDIS_PASSWORD:redispass}
    cassandra:
      keyspace-name: ${CASSANDRA_KEYSPACE:tripplanning}
      contact-points: ${CASSANDRA_CONTACT_POINTS:localhost}
      port: ${CASSANDRA_PORT:9042}
      local-datacenter: ${CASSANDRA_DATACENTER:datacenter1}

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:tripplanning-secret-key-for-jwt-token-signing}
  expiration: ${JWT_EXPIRATION:86400000}

feign:
  itinerary-service:
    url: ${FEIGN_ITINERARY_SERVICE_URL:http://itinerary-service:8080}

management:
  endpoints:
    web:
      exposure:
        include: "prometheus,health,info"
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true