apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    url: http://tripplanning-prometheus:9090
    access: proxy
    isDefault: true
    jsonData:
      timeInterval: 15s

  - name: Loki
    type: loki
    uid: loki
    url: http://tripplanning-loki:3100
    access: proxy
    isDefault: false
    jsonData:
      maxLines: 1000
