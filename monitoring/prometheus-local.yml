global:
  scrape_interval: 15s

scrape_configs:
  - job_name: user-service
    static_configs:
      - targets: ['user-service:8080']
    metrics_path: /actuator/prometheus
    scheme: http

  - job_name: itinerary-service
    static_configs:
      - targets: ['itinerary-service:8080']
    metrics_path: /actuator/prometheus

  - job_name: destination-service
    static_configs:
      - targets: ['destination-service:8080']
    metrics_path: /actuator/prometheus

  - job_name: activity-service
    static_configs:
      - targets: ['activity-service:8080']
    metrics_path: /actuator/prometheus

  - job_name: booking-service
    static_configs:
      - targets: ['booking-service:8080']
    metrics_path: /actuator/prometheus
